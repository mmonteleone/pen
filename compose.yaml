# pen session stack: one compose project per session ("<project key>-<session>").
# The CLI copies this file into the session's dir next to squid.conf,
# allowlist.txt and proxy.log, so the relative paths below resolve there.
#
# Required env (set by the CLI):
#   PROJECT_DIR     host absolute path of the project, mounted at the same path
#   PEN_PROJECT     project key (pen-<dir>-<hash>); names the volumes
#   PEN_UID/PEN_GID host user, created in the container at start
#   NUGET_PACKAGES  host NuGet cache path; the project's nuget volume mounts there
#   PEN_IMAGE       image to run (default pen:latest; the tools image or project layer when there is one)
#   PEN_SEED        host home seed (~/.config/pen/home), mounted read-only at /etc/pen/seed
#
# The CLI also writes a per-session override (session.yaml): the read-only
# overlays on the project mount; in docker sessions (--profile docker), dind's
# container name and the agent's DOCKER_HOST and depends_on dind; and with
# forwarded ports, a socat "ports" service on sandbox and a non-internal
# "ports" network, publishing them on the host's 127.0.0.1.

x-proxy-env: &proxy-env
  HTTP_PROXY: http://proxy:3128
  HTTPS_PROXY: http://proxy:3128
  NO_PROXY: localhost,127.0.0.1,proxy,dind
  http_proxy: http://proxy:3128
  https_proxy: http://proxy:3128
  no_proxy: localhost,127.0.0.1,proxy,dind

services:
  agent:
    image: ${PEN_IMAGE:-pen:latest}
    hostname: pen
    working_dir: ${PROJECT_DIR:?PROJECT_DIR is required}
    environment:
      <<: *proxy-env
      PEN_UID: ${PEN_UID:?PEN_UID is required}
      PEN_GID: ${PEN_GID:?PEN_GID is required}
      PROJECT_DIR: ${PROJECT_DIR}
      NUGET_PACKAGES: ${NUGET_PACKAGES:?NUGET_PACKAGES is required}
    # Root phase of the entrypoint needs only these; it then drops to the agent
    # user with an empty bounding set (see image/entrypoint.sh).
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, SETPCAP]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 4096
    # No core dumps: they'd land in the project dir (cwd) on hosts whose
    # core_pattern is a plain file name, holding process memory (GH_TOKEN, keys).
    ulimits:
      core: 0
    tmpfs:
      - /tmp:exec,mode=1777,size=4g
      - /var/tmp:exec,mode=1777,size=1g
    volumes:
      - type: bind
        source: ${PROJECT_DIR}
        target: ${PROJECT_DIR}
      - type: volume
        source: home
        target: /home/agent
      - type: bind
        source: ${PEN_SEED:?PEN_SEED is required}
        target: /etc/pen/seed
        read_only: true
      - type: volume
        source: nuget
        target: ${NUGET_PACKAGES}
    networks: [sandbox]
    depends_on:
      proxy:
        condition: service_healthy

  proxy:
    image: ubuntu/squid:latest
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    # tmpfs over the dirs the image declares as volumes, which would otherwise
    # leave two anonymous volumes behind per session (proxy.log is bound into
    # the log dir, and squid keeps no disk cache).
    volumes:
      - type: tmpfs
        target: /var/log/squid
        tmpfs: {size: 16m, mode: 01777}
      - type: tmpfs
        target: /var/spool/squid
        tmpfs: {size: 16m, mode: 01777}
      - type: bind
        source: ./squid.conf
        target: /etc/squid/squid.conf
        read_only: true
      - type: bind
        source: ./allowlist.txt
        target: /etc/squid/allowlist.txt
        read_only: true
      - type: bind
        source: ./proxy.log
        target: /var/log/squid/access.log
    networks: [sandbox, egress]
    # Healthy once something listens on 3128 (0x0C38, state 0A). Reads
    # /proc/net instead of connecting, so probes never show up in proxy.log.
    healthcheck:
      test: ["CMD", "grep", "-qE", "^ *[0-9]+: [0-9A-F]+:0C38 [0-9A-F]+:[0-9A-F]+ 0A ", "/proc/net/tcp", "/proc/net/tcp6"]
      interval: 30s
      timeout: 2s
      retries: 3
      start_period: 30s
      start_interval: 100ms

  # Docker-in-Docker, for docker sessions only (pen --docker). Privileged, on
  # the internal network only, TLS off: port 2375 is reachable from this
  # session's sandbox network alone. --tls=false must be explicit, or dockerd
  # sleeps 15 s at startup to show its insecure-TCP warning.
  dind:
    image: docker:dind
    profiles: [docker]
    privileged: true
    command: ["dockerd", "--host=tcp://0.0.0.0:2375", "--tls=false"]
    environment:
      <<: *proxy-env
      DOCKER_TLS_CERTDIR: ""
    pids_limit: 16384
    # Containers inside inherit the daemon's limits; no core dumps in the project.
    ulimits:
      core: 0
    volumes:
      - type: bind
        source: ${PROJECT_DIR}
        target: ${PROJECT_DIR}
      - type: volume
        source: dind
        target: /var/lib/docker
    networks: [sandbox]
    # 127.0.0.1 is in NO_PROXY, so this never goes through the proxy.
    healthcheck:
      test: ["CMD", "docker", "-H", "tcp://127.0.0.1:2375", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 100ms

# Shared by every session of the project, so they're external: each session is
# its own compose project, and compose would otherwise warn that the volume was
# "created for" another one. The CLI creates them (docker volume create is
# idempotent) before `compose run`.
volumes:
  home:
    name: ${PEN_PROJECT:?PEN_PROJECT is required}_home
    external: true
  nuget:
    name: ${PEN_PROJECT}_nuget
    external: true
  dind:
    name: ${PEN_PROJECT}_dind
    external: true

networks:
  # No route out: anything that ignores the proxy fails.
  sandbox:
    internal: true
  egress: {}
