# pen user config (TOML: https://toml.io). Settings here apply to every
# project. A project's .pen/config.toml takes allow, github_owner and docker (no
# tokens or env, since it's usually committed); its allow adds to this one.
# Changes apply to the next session. Keep this file private (mode 600): it
# holds secrets.

# --- Network -----------------------------------------------------------------------
# Extra domains the sandbox may reach, on top of pen's defaults (AI providers,
# GitHub, package registries). A leading dot also allows subdomains.
# `pen allow --global <domain>` adds entries here.

allow = [
  # "example.com",
  # ".example.org",
]

# --- GitHub (read-only) --------------------------------------------------------
# One fine-grained, read-only PAT per owner (your account or an org):
# Contents and Metadata read (optionally Issues and Pull requests read). Pick
# "Only select repositories" if you can. The owner comes from the project's
# origin URL, or from github_owner in its .pen/config.toml.

[github]
# my-user = "github_pat_…"
# my-org = "github_pat_…"

# --- Agent environment -----------------------------------------------------------
# Passed to the agent container only, by name (never on a command line).

[env]
# ANTHROPIC_API_KEY = "sk-ant-…"
# OPENAI_API_KEY = "sk-…"
#
# Skip Claude's per-project login: run `claude setup-token` once, anywhere, and
# paste the token here. It's long-lived, so treat it like an API key.
# CLAUDE_CODE_OAUTH_TOKEN = "…"
