# Node from the official tarball, by major version (node:24 is the newest 24.x), in
# /usr/local with npm and npx (and corepack, which Node 24 and earlier bundle). npm's
# global prefix is /usr/local, in the image. node-gyp's python3 and build tools come too.
default = "26"
# The even (LTS) majors since 20. 20 is out of support. A newer major needs this recipe
# updated.
version = '^(20|22|24|26)$'
multiple = false
allow = [
  "registry.npmjs.org",
  "registry.yarnpkg.com",
  # Yarn 2+ releases, fetched by corepack
  "repo.yarnpkg.com",
  # Node headers for node-gyp, if it ignores npm_config_nodedir; also the API docs
  "nodejs.org",
]

[env]
# node-gyp builds native modules against the headers in the tarball
# (/usr/local/include/node) instead of downloading them.
npm_config_nodedir = "/usr/local"
# The base's NODE_USE_ENV_PROXY makes Node 22 warn on every start that its proxy agent is
# experimental (24 and later don't). Only that warning is turned off; Node 20, which
# ignores NODE_USE_ENV_PROXY, accepts the flag too. A NODE_OPTIONS of the user's or
# project's replaces this one.
NODE_OPTIONS = "--disable-warning=UNDICI-EHPA"
