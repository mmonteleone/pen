# .NET SDKs, one per major version (dotnet:8 dotnet:10), with PowerShell.
default = "10"
# Major versions with an SDK that installs and runs on Ubuntu 24.04. 11 is a preview
# until it ships; a newer one needs this recipe updated.
version = '^(6|7|8|9|10|11)$'
multiple = true
allow = [
  ".nuget.org",
  "builds.dotnet.microsoft.com",
  "aka.ms",
  # dotnet's workload manifest check (dotnet new, build)
  "www.microsoft.com",
  # Certificate revocation (CRL/OCSP) for NuGet package signature verification
  "crl3.digicert.com",
  "ocsp.digicert.com",
]

# No DOTNET_VERSION, ASPNET_VERSION or DOTNET_SDK_VERSION: with several SDKs, one
# version would be wrong.
[env]
ASPNETCORE_HTTP_PORTS = "8080"
DOTNET_RUNNING_IN_CONTAINER = "true"
DOTNET_GENERATE_ASPNET_CERTIFICATE = "false"
DOTNET_USE_POLLING_FILE_WATCHER = "true"
NUGET_XMLDOC_MODE = "skip"
POWERSHELL_DISTRIBUTION_CHANNEL = "PSDocker-DotnetSDK-Ubuntu-24.04"
DOTNET_NOLOGO = "1"
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
