# CPython by minor version (python:3.13 is the newest 3.13.x the pinned uv knows), as uv's
# managed builds, with uv and uvx. Several can be installed together; python3 and python
# are the newest. uv finds these on PATH, and downloads any other Python a project asks
# for into the home volume.
default = "3.15"
# The minor versions uv has managed builds of, from 3.9 (it has 3.8 too, long out of
# support). 3.9 and 3.10 are out of support, and 3.16 is a pre-release until it ships. A
# newer minor version needs this recipe updated.
version = '^3\.(9|1[0-5])$'
multiple = true
allow = [
  "pypi.org",
  "files.pythonhosted.org",
  # uv's Python downloads (python-build-standalone): it tries Astral's mirror before
  # GitHub
  "releases.astral.sh",
]

# No UV_PYTHON_INSTALL_DIR: it stays uv's default in the home volume, since /usr/local
# isn't writable in a session.
[env]
# uv's cache (~/.cache/uv, the home volume) and a project's .venv are never on the same
# filesystem, so uv would warn on every install that it can't hardlink, and then copy.
UV_LINK_MODE = "copy"
