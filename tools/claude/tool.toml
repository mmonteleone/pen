# Claude Code, the agent, from npm: claude:latest is the newest release when its tools
# image is built (pen upgrade gives a new base, so it reinstalls on next use), or an exact
# release from 2.1.113 on, claude:2.1.300.
kind = "agent"
default = "latest"
version = '^(latest|[0-9]+\.[0-9]+\.[0-9]+)$'
multiple = false
allow = [
  # API, OAuth login, telemetry and feature flags
  ".anthropic.com",
  ".claude.ai",
  ".claude.com",
]

[env]
# No auto-updates: the image is the only way to upgrade (and /opt/pen isn't writable).
DISABLE_AUTOUPDATER = "1"
CLAUDE_CODE_DISABLE_AUTOUPDATE = "1"
