# Pen egress proxy. Allows CONNECT on 443 and plain HTTP only to the domains in
# the merged allowlist; denies everything else. No TLS interception, no cache.

http_port 3128

# -n: never reverse-resolve, so a CONNECT to a bare IP can't match an allowed
# domain through its PTR record.
acl allowed dstdomain -n "/etc/squid/allowlist.txt"

acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny manager
http_access allow allowed
http_access deny all

# One line per request, written to the session's bind-mounted proxy.log.
# The CLI greps TCP_DENIED lines from it to list blocked domains.
# Written as each request ends (not buffered), so a fast teardown loses nothing.
logformat pen %{%Y-%m-%dT%H:%M:%SZ}tg %>a %Ss/%03>Hs %rm %ru %<a
access_log stdio:/var/log/squid/access.log logformat=pen
buffered_logs off
logfile_rotate 0
cache_log /dev/stderr
cache_store_log none
# The ICMP pinger needs NET_RAW, which the proxy doesn't get.
pinger_enable off

# Forward proxy only: no caching, and don't advertise the client.
cache deny all
cache_mem 0 MB
forwarded_for delete
via off

# Short restart/reconfigure (pen allow) and teardown.
shutdown_lifetime 1 seconds
pid_filename /run/squid.pid
coredump_dir /var/spool/squid
